name: iOS Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      # RoboVM 需要 Arc 仓库提供的 iOS 原生库（libarc-freetype.a）；
      # settings.gradle 检测到 ../Arc 后会用本地源码构建依赖（官方 CI 同款做法）
      - name: Clone Arc repository
        run: |
          ARC_HASH=$(grep '^archash=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "Cloning Arc at commit: $ARC_HASH"
          git clone https://github.com/Anuken/Arc ../Arc
          git -C ../Arc checkout "$ARC_HASH"

      # MetalANGLEKit（OpenGL ES -> Metal 转换层）等框架不在 Arc git 仓库中：
      # 上游 backend-robovm 定义了 extractMetalANGLEKit 任务（从 libgdx/MetalANGLEKit
      # 官方 release 下载并解压框架到 res/META-INF/robovm/ios/libs/），但该任务
      # 未挂到常规构建链上，不触发它的话 jar 里没有框架，链接时会报
      # "ld: framework 'MetalANGLEKit' not found"
      - name: Fetch MetalANGLEKit frameworks
        run: |
          cd ../Arc
          ./gradlew :backends:backend-robovm:extractMetalANGLEKit --no-daemon

      # Arc 上游提交 f8713450 删除了 natives/natives-ios（"iOS natives are no longer needed"），
      # 但 backend-robovm 的 Java 代码仍引用其中的原生符号，且 ios/build.gradle 的
      # copyNatives 任务还在从该目录复制（目录不存在时静默跳过）。官方 robovm.xml 把
      # <lib>libs/libarc.a</lib> 改成了 <framework>arc</framework>，但从未有任何地方
      # 提供 arc.framework，CI 上必然报 "ld: framework 'arc' not found"（上游遗留 bug，
      # Anuken 本地靠删除前遗留的 ios/libs/libarc.a 构建，所以没发现）。
      # 修复：ios/robovm.xml 已改回 <lib>libs/libarc.a</lib>，此处从 Arc 删除前
      # 的最后提交（ad320d6d，即 f8713450 的 parent）下载该静态库。
      - name: Fetch libarc.a (arc iOS static library)
        run: |
          mkdir -p ios/libs
          curl -fsSL -o ios/libs/libarc.a \
            https://raw.githubusercontent.com/Anuken/Arc/ad320d6da348caa182d1638c640cf9fd4784591e/natives/natives-ios/libs/libarc.a
          ls -l ios/libs/libarc.a

      # 注意：secrets 上下文不能用在 if 条件里（GitHub Actions 限制），
      # 因此签名相关的分支判断全部放在脚本内部
      - name: Set up iOS code signing
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_B64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
          SIGN_IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$CERT_B64" ]; then
            echo "::notice::No signing secrets configured. An unsigned IPA will be built."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 12)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # 禁止空闲自动锁定（默认几分钟无操作就会锁上，锁上后签名阶段会失败）
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

          # 关键：新建的 keychain 不会自动加入搜索列表，而 RoboVM 是通过
          # `security find-identity -v -p codesigning`（只搜搜索列表）查找签名身份的，
          # 不执行这一行就会报 "No signing identity found matching '...'"
          security list-keychains -d -s "$KEYCHAIN"

          # 用与 RoboVM 相同的方式校验签名身份，尽早失败并给出可读错误
          FIND_OUTPUT="$(security find-identity -v -p codesigning 2>&1)"
          echo "$FIND_OUTPUT"
          if ! echo "$FIND_OUTPUT" | grep -q '[1-9][0-9]* valid identities found'; then
            echo "::error::No valid codesigning identity in keychain. Check that IOS_CERTIFICATE_B64 is a .p12 containing BOTH the certificate and its private key, and that IOS_CERTIFICATE_PASSWORD is correct."
            exit 1
          fi
          if [ -n "$SIGN_IDENTITY" ] && ! echo "$FIND_OUTPUT" | grep -qF "\"$SIGN_IDENTITY\""; then
            echo "::error::IOS_SIGN_IDENTITY does not match any identity in the keychain (see list above). It must match exactly, e.g. 'Apple Distribution: Company Name (TEAM123456)'."
            exit 1
          fi

          if [ -n "$PROFILE_B64" ]; then
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            echo "$PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"
          fi

      - name: Build IPA
        env:
          SIGN_IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -n "$SIGN_IDENTITY" ] && [ -n "$PROVISIONING_PROFILE" ]; then
            echo "Building signed IPA..."
            ./gradlew ios:createIPA \
              -PsignIdentity="$SIGN_IDENTITY" \
              -PprovisioningProfile="$PROVISIONING_PROFILE"
          elif [ -n "$SIGN_IDENTITY" ]; then
            echo "Building signed IPA (no provisioning profile UUID provided)..."
            ./gradlew ios:createIPA -PsignIdentity="$SIGN_IDENTITY"
          else
            echo "Building unsigned IPA..."
            ./gradlew ios:createIPA
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-ios
          path: ios/build/**/*.ipa
          if-no-files-found: error

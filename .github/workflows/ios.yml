name: iOS Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      # RoboVM 需要 Arc 仓库提供的 iOS 原生库（libarc-freetype.a）；
      # settings.gradle 检测到 ../Arc 后会用本地源码构建依赖（官方 CI 同款做法）
      - name: Clone Arc repository
        run: |
          ARC_HASH=$(grep '^archash=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "Cloning Arc at commit: $ARC_HASH"
          git clone https://github.com/Anuken/Arc ../Arc
          git -C ../Arc checkout "$ARC_HASH"

      # MetalANGLEKit（OpenGL ES -> Metal 转换层）等框架不在 Arc git 仓库中：
      # 上游 backend-robovm 定义了 extractMetalANGLEKit 任务（从 libgdx/MetalANGLEKit
      # 官方 release 下载并解压框架到 res/META-INF/robovm/ios/libs/），但该任务
      # 未挂到常规构建链上，不触发它的话 jar 里没有框架，链接时会报
      # "ld: framework 'MetalANGLEKit' not found"
      - name: Fetch MetalANGLEKit frameworks
        run: |
          cd ../Arc
          ./gradlew :backends:backend-robovm:extractMetalANGLEKit --no-daemon

      # 注意：secrets 上下文不能用在 if 条件里（GitHub Actions 限制），
      # 因此签名相关的分支判断全部放在脚本内部
      - name: Set up iOS code signing
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_B64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          if [ -z "$CERT_B64" ]; then
            echo "::notice::No signing secrets configured. An unsigned IPA will be built."
            exit 0
          fi

          KEYCHAIN="build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 12)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

          if [ -n "$PROFILE_B64" ]; then
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            echo "$PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"
          fi

      - name: Build IPA
        env:
          SIGN_IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -n "$SIGN_IDENTITY" ] && [ -n "$PROVISIONING_PROFILE" ]; then
            echo "Building signed IPA..."
            ./gradlew ios:createIPA \
              -PsignIdentity="$SIGN_IDENTITY" \
              -PprovisioningProfile="$PROVISIONING_PROFILE"
          elif [ -n "$SIGN_IDENTITY" ]; then
            echo "Building signed IPA (no provisioning profile UUID provided)..."
            ./gradlew ios:createIPA -PsignIdentity="$SIGN_IDENTITY"
          else
            echo "Building unsigned IPA..."
            ./gradlew ios:createIPA
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-ios
          path: ios/build/**/*.ipa
          if-no-files-found: error

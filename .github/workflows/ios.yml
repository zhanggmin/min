name: iOS Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      # RoboVM 需要 Arc 仓库提供的 iOS 原生库（libarc-freetype.a）；
      # settings.gradle 检测到 ../Arc 后会用本地源码构建依赖（官方 CI 同款做法）
      - name: Clone Arc repository
        run: |
          ARC_HASH=$(grep '^archash=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "Cloning Arc at commit: $ARC_HASH"
          git clone https://github.com/Anuken/Arc ../Arc
          git -C ../Arc checkout "$ARC_HASH"

      # arc.xcframework 必须从 archash 锁定的 Arc 源码构建，确保 Java JNI 声明和
      # 原生符号完全匹配。MetalANGLEKit 等框架由 Arc 的下载任务准备。它们还需要
      # 复制到 ios/libs，因为 robovm.xml 显式从该目录引用各 XCFramework 的真机切片。
      - name: Prepare iOS native frameworks
        run: |
          cd ../Arc
          ./gradlew :arc-core:jnigenBuildAllIOS \
            :backends:backend-robovm:extractMetalANGLEKit \
            --no-daemon
          cd "$GITHUB_WORKSPACE"
          mkdir -p ios/libs
          cp -R ../Arc/arc-core/build/natives/arc.xcframework ios/libs/
          cp -R ../Arc/backends/backend-robovm/res/META-INF/robovm/ios/libs/*.xcframework ios/libs/
          test -f ios/libs/arc.xcframework/ios-arm64/arc.framework/arc
          test -f ios/libs/MetalANGLEKit.xcframework/ios-arm64/MetalANGLEKit.framework/MetalANGLEKit

      # 注意：secrets 上下文不能用在 if 条件里（GitHub Actions 限制），
      # 因此签名相关的分支判断全部放在脚本内部
      - name: Set up iOS code signing
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_B64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          if [ -z "$CERT_B64" ] && [ -z "$PROFILE_B64" ]; then
            echo "::notice::No signing secrets configured. An unsigned IPA will be built."
            exit 0
          fi
          if [ -z "$CERT_B64" ] || [ -z "$PROFILE_B64" ]; then
            echo "::error::Signed builds require both IOS_CERTIFICATE_B64 and IOS_PROVISIONING_PROFILE_B64."
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 12)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # 禁止空闲自动锁定（默认几分钟无操作就会锁上，锁上后签名阶段会失败）
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

          # 关键：新建的 keychain 不会自动加入搜索列表，而 RoboVM 是通过
          # `security find-identity -v -p codesigning`（只搜搜索列表）查找签名身份的，
          # 不执行这一行就会报 "No signing identity found matching '...'"
          # 注意 -d 必须显式指定 domain 值（user），GitHub 官方文档同款写法
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # 确认证书和私钥导入成功，并保留有效 identity 的 SHA-1 指纹。
          FIND_OUTPUT="$(security find-identity -v -p codesigning 2>&1)"
          echo "$FIND_OUTPUT"
          # 排除 CSSMERR 标记的无效证书，与 RoboVM 的解析规则一致。
          NAMES="$(echo "$FIND_OUTPUT" | sed -nE '/CSSMERR_TP_CERT_/d; s/^[[:space:]]*[0-9]+\)[[:space:]]+[0-9A-F]+[[:space:]]+"([^"]*)".*/\1/p')"
          IDENTITY_FINGERPRINTS="$(echo "$FIND_OUTPUT" | sed -nE '/CSSMERR_TP_CERT_/d; s/^[[:space:]]*[0-9]+\)[[:space:]]+([0-9A-F]+).*/\1/p')"
          if [ -z "$NAMES" ]; then
            echo "::error::No valid codesigning identity in keychain. Check that IOS_CERTIFICATE_B64 is a .p12 containing BOTH the certificate and its private key, and that IOS_CERTIFICATE_PASSWORD is correct."
            exit 1
          fi

          if [ -n "$PROFILE_B64" ]; then
            PROFILE_FILE="$RUNNER_TEMP/build.mobileprovision"
            PROFILE_PLIST="$RUNNER_TEMP/build-profile.plist"
            printf '%s' "$PROFILE_B64" | base64 --decode > "$PROFILE_FILE"

            # mobileprovision 是 CMS 容器，先解码并从文件本身取得 UUID。
            # 这样只配置 IOS_PROVISIONING_PROFILE_B64 即可，不再依赖另一个
            # IOS_PROVISIONING_PROFILE secret，否则 RoboVM 不会拿到 profile 参数。
            if ! security cms -D -i "$PROFILE_FILE" > "$PROFILE_PLIST"; then
              echo "::error::IOS_PROVISIONING_PROFILE_B64 is not a valid .mobileprovision file."
              exit 1
            fi
            PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST" 2>/dev/null || true)"
            PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST" 2>/dev/null || true)"
            if [ -z "$PROFILE_UUID" ]; then
              echo "::error::The provisioning profile does not contain a UUID."
              exit 1
            fi

            # RoboVM 2.3.26 在未显式指定 identity 时只自动搜索开发证书
            # (Apple Development)，无法自动选中 Apple Distribution。比较 profile
            # 中 DeveloperCertificates 的 SHA-1 与 keychain identity，找到精确匹配项。
            PROFILE_FINGERPRINTS="$RUNNER_TEMP/profile-certificate-fingerprints.txt"
            python3 - "$PROFILE_PLIST" "$PROFILE_FINGERPRINTS" <<'PY'
          import hashlib
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as stream:
              profile = plistlib.load(stream)
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              for certificate in profile.get("DeveloperCertificates", []):
                  print(hashlib.sha1(certificate).hexdigest().upper(), file=stream)
          PY

            MATCHED_IDENTITY=""
            while IFS= read -r PROFILE_FINGERPRINT; do
              if printf '%s\n' "$IDENTITY_FINGERPRINTS" | grep -qxF "$PROFILE_FINGERPRINT"; then
                MATCHED_IDENTITY="$PROFILE_FINGERPRINT"
                break
              fi
            done < "$PROFILE_FINGERPRINTS"
            if [ -z "$MATCHED_IDENTITY" ]; then
              echo "::error::The imported .p12 contains no signing identity listed in the provisioning profile. Export the certificate and private key that were used to create this profile."
              exit 1
            fi

            # RoboVM 2.3.26 同时扫描旧目录和 Xcode 16+ 的新目录；安装到新目录
            # 并使用标准的 UUID 文件名，避免 Xcode 清理旧目录中的 profile。
            PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            mkdir -p "$PROFILE_DIR"
            cp "$PROFILE_FILE" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
            echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
            echo "IOS_SIGNING_IDENTITY=$MATCHED_IDENTITY" >> "$GITHUB_ENV"
            echo "Installed provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"
            echo "Matched signing identity fingerprint: $MATCHED_IDENTITY"
          fi

      # GITHUB_RUN_NUMBER 在每次新的 workflow 运行时加 1。加上已上传的
      # 构建号 40，保证新的 CFBundleVersion 从 41 开始递增。
      - name: Build IPA
        run: |
          BUILD_NUMBER="$((40 + GITHUB_RUN_NUMBER))"
          echo "iOS build number (CFBundleVersion): $BUILD_NUMBER"
          if [ -n "$IOS_PROFILE_UUID" ]; then
            echo "Building signed IPA with the identity matched from the profile..."
            ./gradlew ios:createIPA \
              -PappBuild="$BUILD_NUMBER" \
              -PsignIdentity="$IOS_SIGNING_IDENTITY" \
              -PprovisioningProfile="$IOS_PROFILE_UUID"
          else
            echo "Building unsigned IPA..."
            ./gradlew ios:createIPA -PappBuild="$BUILD_NUMBER"
          fi

      # 上传前直接检查归档内容，避免到 App Store Connect 才发现 profile 未嵌入。
      - name: Validate signed IPA
        run: |
          if [ -z "$IOS_PROFILE_UUID" ]; then
            echo "Unsigned build: skipping embedded provisioning profile validation."
            exit 0
          fi

          IPA="$(find ios/build -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA" ]; then
            echo "::error::No IPA was produced."
            exit 1
          fi
          PROFILE_ENTRY="$(unzip -Z1 "$IPA" | sed -nE '/^Payload\/[^/]+\.app\/embedded\.mobileprovision$/p')"
          if [ -z "$PROFILE_ENTRY" ]; then
            echo "::error::Signed IPA does not contain Payload/*.app/embedded.mobileprovision."
            exit 1
          fi
          echo "Validated embedded provisioning profile: $PROFILE_ENTRY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-ios
          path: ios/build/**/*.ipa
          if-no-files-found: error
